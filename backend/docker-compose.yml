services:
  db:
    image: postgres:15-alpine
    container_name: t-rent-db
    environment:
      POSTGRES_USER: trent
      POSTGRES_PASSWORD: trent_password
      POSTGRES_DB: t_rent
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trent -d t_rent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
